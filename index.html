<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kurio — Marketplace de NFTs</title>
    <meta name="description" content="Kurio: descubra, colecione e compre NFTs de criadores emergentes e consagrados, com carteiras simuladas e confirmação em tempo real." />
    <meta name="theme-color" content="#160c0a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Font ready before first paint: avoids the swap reflow (CLS) on slow networks -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource-variable/roboto-mono/files/roboto-mono-latin-wght-normal.woff2" />
    <link
      rel="preload"
      as="image"
      href="/images/nft/emerald-640.webp"
      imagesrcset="/images/nft/emerald-320.webp 320w, /images/nft/emerald-640.webp 640w, /images/nft/emerald-960.webp 960w"
      imagesizes="(min-width: 768px) 450px, 40vw"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Ative o JavaScript para usar a Kurio.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
