[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# A missing build asset (e.g. a tab opened before a deploy) is a 404, never the HTML fallback below.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# SPA fallback: direct access/refresh on any route serves index.html (existing files win).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# script-src hash = inline script of the Netlify free-tier badge (srcdoc iframes inherit this CSP).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-BkKP2XO6WOEc3kXOiLr2ZoY83hamalKjPY9xBcbXVuw='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss://realtime.kurio.test; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/mockServiceWorker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/mock-sw.js"
  [headers.values]
    Cache-Control = "no-cache"
